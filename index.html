<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JavaScript Documentation (Kenyan Edition)</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="JavaScript Documentation - Kenyan Edition">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Docsify Base Dark Theme Layout -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <!-- Prism Syntax Highlighting -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css">

  <style>
    :root {
      --bg-main: #222222;
      --bg-sidebar: #2d2d2d;
      --bg-topbar: #18191a;
      --text-main: #d6d9dc;
      --text-heading: #ffffff;
      --text-muted: #9ba1a6;
      --link-color: #63b3ed;
      --link-hover: #90cdf4;
      --border-color: #383a3d;
      --code-bg: #161718;
      --code-inline-bg: #2e3033;
      --quote-bg: #272a2e;
      --quote-border: #4299e1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-main) !important;
      color: var(--text-main) !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      font-size: 15px;
      line-height: 1.7;
    }

    /* Top Python-docs style navigation bar */
    .py-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 42px;
      background-color: var(--bg-topbar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      font-size: 13px;
      color: var(--text-muted);
    }
    .py-topbar a {
      color: var(--link-color);
      text-decoration: none;
    }
    .py-topbar a:hover {
      text-decoration: underline;
    }
    .py-breadcrumbs {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .js-official-logo {
      width: 20px;
      height: 20px;
      vertical-align: middle;
      border-radius: 3px;
      display: inline-block;
      flex-shrink: 0;
    }
    .theme-tag {
      background-color: #2b2d30;
      border: 1px solid #3e4247;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      color: #cbd5e0;
    }

    /* Sidebar Styling (Exact Python Docs Table of Contents) */
    .sidebar {
      position: fixed !important;
      top: 42px !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 290px !important;
      background-color: var(--bg-sidebar) !important;
      border-right: 1px solid var(--border-color) !important;
      padding: 20px 18px 40px !important;
      overflow-y: auto !important;
      color: var(--text-muted) !important;
      z-index: 100;
    }
    
    .sidebar-nav {
      padding-left: 0 !important;
    }

    .sidebar > h1, .app-name {
      display: none !important;
    }

    .sidebar ul {
      list-style-type: square !important;
      padding-left: 18px !important;
      margin: 6px 0 !important;
    }

    .sidebar ul li {
      margin: 6px 0 !important;
      color: #8892b0 !important;
      font-size: 13.5px !important;
    }

    .sidebar ul li strong {
      color: #ffffff !important;
      font-size: 14px !important;
      display: block;
      margin-top: 16px;
      margin-bottom: 8px;
      font-weight: 700 !important;
      letter-spacing: -0.01em;
      text-transform: none !important;
    }

    .sidebar ul li a {
      color: #cbd5e0 !important;
      text-decoration: none !important;
      transition: color 0.15s ease;
      font-size: 13.5px !important;
    }

    .sidebar ul li a:hover {
      color: var(--link-hover) !important;
      text-decoration: underline !important;
    }

    .sidebar ul li.active > a {
      color: #ffffff !important;
      font-weight: 600 !important;
    }

    /* Search Input */
    .search {
      margin-bottom: 16px !important;
      padding: 0 !important;
      border: none !important;
    }
    .search input {
      width: 100% !important;
      background-color: #1e2022 !important;
      border: 1px solid #3c4044 !important;
      border-radius: 4px !important;
      color: #e2e8f0 !important;
      padding: 7px 12px !important;
      font-size: 13px !important;
      outline: none !important;
    }
    .search input:focus {
      border-color: #4299e1 !important;
    }

    /* Main Content */
    .content {
      position: absolute !important;
      top: 42px !important;
      left: 290px !important;
      right: 0 !important;
      bottom: 0 !important;
      padding: 40px 60px 80px !important;
      max-width: 980px !important;
      background-color: var(--bg-main) !important;
    }

    .markdown-section {
      max-width: 100% !important;
      padding: 0 !important;
      color: var(--text-main) !important;
    }

    /* Headings (Exact Python Tutorial Style) */
    .markdown-section h1 {
      font-size: 32px !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      margin-top: 10px !important;
      margin-bottom: 24px !important;
      border-bottom: none !important;
      letter-spacing: -0.02em;
    }

    .markdown-section h2 {
      font-size: 22px !important;
      font-weight: 600 !important;
      color: #ffffff !important;
      margin-top: 40px !important;
      margin-bottom: 16px !important;
      border-bottom: 1px solid #34373b !important;
      padding-bottom: 8px !important;
    }

    .markdown-section h3 {
      font-size: 17px !important;
      font-weight: 600 !important;
      color: #edf2f7 !important;
      margin-top: 26px !important;
      margin-bottom: 12px !important;
    }

    .markdown-section p, .markdown-section li {
      color: #d1d5db !important;
      font-size: 15px !important;
      line-height: 1.75 !important;
    }

    .markdown-section a {
      color: var(--link-color) !important;
      text-decoration: none !important;
    }
    .markdown-section a:hover {
      color: var(--link-hover) !important;
      text-decoration: underline !important;
    }

    /* Inline Code */
    :not(pre) > code {
      background-color: var(--code-inline-bg) !important;
      color: #edf2f7 !important;
      border: 1px solid #444a50 !important;
      border-radius: 4px !important;
      padding: 2px 6px !important;
      font-family: 'Fira Code', Consolas, monospace !important;
      font-size: 13.5px !important;
      font-weight: 500;
    }

    /* Code Blocks */
    .markdown-section pre {
      background-color: var(--code-bg) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 6px !important;
      padding: 16px 20px !important;
      margin: 20px 0 !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3) !important;
    }

    .markdown-section pre code {
      background-color: transparent !important;
      font-family: 'Fira Code', Consolas, monospace !important;
      font-size: 14px !important;
      line-height: 1.6 !important;
      padding: 0 !important;
    }

    /* Blockquotes */
    .markdown-section blockquote {
      background-color: var(--quote-bg) !important;
      border-left: 4px solid var(--quote-border) !important;
      border-radius: 0 6px 6px 0 !important;
      color: #cbd5e1 !important;
      margin: 24px 0 !important;
      padding: 14px 20px !important;
    }

    .markdown-section blockquote p {
      color: #e2e8f0 !important;
      margin: 0 !important;
    }

    /* Tables */
    .markdown-section table {
      border-collapse: collapse !important;
      width: 100% !important;
      margin: 24px 0 !important;
      background-color: #1a1b1c !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 6px !important;
      overflow: hidden;
    }

    .markdown-section th {
      background-color: #272a2e !important;
      color: #ffffff !important;
      font-weight: 600 !important;
      border: 1px solid var(--border-color) !important;
      padding: 10px 16px !important;
      text-align: left !important;
    }

    .markdown-section td {
      border: 1px solid var(--border-color) !important;
      color: #cbd5e0 !important;
      padding: 9px 16px !important;
    }

    .markdown-section tr:nth-child(even) td {
      background-color: #202224 !important;
    }

    /* Copy Button */
    .docsify-copy-code-button {
      background-color: #2d3135 !important;
      color: #cbd5e0 !important;
      border-radius: 4px !important;
      font-size: 12px !important;
      padding: 4px 8px !important;
    }

    /* Mobile Responsive */
    @media screen and (max-width: 768px) {
      .py-topbar {
        font-size: 11px;
        padding: 0 10px;
      }
      .content {
        left: 0 !important;
        padding: 60px 20px 60px !important;
      }
    }
  </style>
</head>
<body>
  <!-- Python Docs Style Top Navigation Header -->
  <header class="py-topbar">
    <div class="py-breadcrumbs">
      <svg class="js-official-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 630" width="20" height="20" aria-label="Original JavaScript Logo">
        <rect width="630" height="630" fill="#f7df1e" rx="40" />
        <path d="m 165.65,526.47375 48.2125,-29.1775 C 223.16375,513.7875 231.625,527.74 251.92,527.74 c 19.45375,0 31.71875,-7.60975 31.71875,-37.21 l 0,-201.3 59.20375,0 0,202.1375 c 0,61.32 -35.94375,89.23125 -88.385,89.23125 -47.36125,0 -74.8525,-24.52875 -88.8075,-54.13" fill="#000000" />
        <path d="m 375,520.13 48.20625,-27.91125 c 12.69,20.72375 29.1825,35.9475 58.36125,35.9475 24.53125,0 40.17375,-12.26475 40.17375,-29.18125 0,-20.29875 -16.06875,-27.48875 -43.135,-39.32625 l -14.7975,-6.3475 c -42.715,-18.18125 -71.05,-41.0175 -71.05,-89.2275 0,-44.40375 33.83125,-78.2375 86.695,-78.2375 37.6375,0 64.7025,13.11125 84.15375,47.36625 l -46.09625,29.60125 c -10.15,-18.1825 -21.1425,-25.37125 -38.0575,-25.37125 -17.33875,0 -28.335,10.995 -28.335,25.37125 0,17.7625 10.99625,24.9525 36.3675,35.94875 l 14.8,6.3425 c 50.325,21.56875 78.66,43.5575 78.66,93.03375 0,53.2875 -41.86625,82.465 -98.11,82.465 -54.97625,0 -90.5,-26.2175 -107.83625,-60.47375" fill="#000000" />
      </svg>
      <span style="font-weight: bold; color: #fff;">JavaScript</span> »
      <span>Kenyan Edition</span> »
      <a href="#/">Documentation</a>
    </div>
    <div style="display: flex; gap: 14px; align-items: center;">
      <span class="theme-tag">Theme: Dark</span>
      <a href="https://github.com/Eminek-marz/kenyan_Swahili-javascript-docs" target="_blank">GitHub</a>
      <a href="#/ABOUT">About</a>
      <a href="#/CONTRIBUTING">Contributing</a>
    </div>
  </header>

  <div id="app">Loading documentation...</div>

  <script>
    window.$docsify = {
      name: 'JS Docs Kenya',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      coverpage: false, // Opens directly to documentation like docs.python.org
      auto2top: true,
      
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Quick search...',
        noData: 'No results found',
        depth: 3
      },

      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>

  <!-- Docsify Core & Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <!-- Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-javascript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
